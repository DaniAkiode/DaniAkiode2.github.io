<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dani — Software Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0d0b;
    --card: #1a1814;
    --line: #2c2924;
    --text: #efe9df;
    --muted: #9a9286;
    --accent: #e0893e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: "Space Grotesk", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(1000px, 90vw); margin: 0 auto; }
  h1, h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; line-height: 1.05; }

  nav { padding: 1.5rem 0; }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: "Instrument Serif", serif; font-size: 1.6rem; }
  .logo span, em { color: var(--accent); }
  nav .links { display: flex; gap: 1.5rem; color: var(--muted); }
  nav .links a:hover { color: var(--text); }

  header { padding: 6rem 0; }
  h1 { font-size: clamp(3rem, 8vw, 5.5rem); }
  header p { color: var(--muted); font-size: 1.15rem; max-width: 520px; margin: 1.5rem 0 2rem; }
  .btn { display: inline-block; padding: .7rem 1.4rem; border-radius: 999px; background: var(--accent); color: #140f0a; font-weight: 500; }
  .btn:hover { opacity: .85; }

  section { padding: 4rem 0; }
  h2 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 2rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; transition: transform .25s, border-color .25s; }
  .card.in:hover { transform: translateY(-4px); border-color: var(--accent); }
  .card .status { font-size: .8rem; color: var(--accent); margin-bottom: .5rem; }
  .card h3 { font-size: 1.25rem; margin-bottom: .5rem; }
  .card p { color: var(--muted); font-size: .95rem; flex: 1; margin-bottom: 1rem; }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
  .tag { font-size: .75rem; padding: .2rem .6rem; border-radius: 6px; background: var(--bg); color: var(--muted); }
  .card .links { display: flex; gap: 1rem; font-size: .9rem; }
  .card .links a:hover { color: var(--accent); }

  .skills { display: flex; flex-wrap: wrap; gap: .6rem; }
  .skill { padding: .5rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); transition: border-color .2s, color .2s; }
  .skill:hover { border-color: var(--accent); color: var(--accent); }

  /* animations */
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  header h1, header p, header .btn { opacity: 0; animation: rise .8s ease forwards; }
  header p { animation-delay: .15s; }
  header .btn { animation-delay: .3s; }
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    header h1, header p, header .btn, .reveal { opacity: 1; transform: none; }
  }

  .contact { text-align: center; }
  .contact p { color: var(--muted); margin-bottom: 1.5rem; }
  footer { padding: 2rem 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#" class="logo">Dani<span>.</span></a>
    <div class="links">
      <a href="#skills">Skills</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<header>
  <div class="wrap">
    <h1>I build software<br>that <em>means</em> something.</h1>
    <p>Full-stack engineer working with Flask, React and PostgreSQL, with a background in cybersecurity.</p>
    <a href="#work" class="btn">See my work →</a>
  </div>
</header>

<section id="skills">
  <div class="wrap">
    <h2 class="reveal">Skills</h2>
    <div class="skills" id="skills-list"></div>
  </div>
</section>

<section id="work">
  <div class="wrap">
    <h2 class="reveal">Projects</h2>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="wrap">
    <h2 class="reveal">Let's <em>talk.</em></h2>
    <p>Open to internships, freelance work and collaborations.</p>
    <a href="mailto:you@example.com" class="btn">you@example.com</a>
  </div>
</section>

<footer>© <span id="year"></span> Dani</footer>

<script>
/* ===== YOUR SKILLS — add, remove or edit these ===== */
const skills = ["Python", "Flask", "JavaScript", "React", "PostgreSQL", "HTML & CSS", "REST APIs", "Git", "Cybersecurity"];

/* ===== YOUR PROJECTS — add, remove or edit these ===== */
const projects = [
  {
    title: "Language Learning App",
    description: "Learn African languages through short daily lessons and native-speaker audio.",
    status: "In progress",
    tags: ["React", "Flask", "PostgreSQL"],
    live: "",
    repo: ""
  },
  {
    title: "Tech Discovery Hub",
    description: "A platform for discovering products, tools and founders in a tech community.",
    status: "Planned",
    tags: ["Flask", "PostgreSQL"],
    live: "",
    repo: ""
  },
  {
    title: "Conversation Practice Tool",
    description: "Practise conversation skills with prompts and feedback.",
    status: "Planned",
    tags: ["React"],
    live: "",
    repo: ""
  }
];

/* ===== renders everything (no need to edit) ===== */
document.getElementById("skills-list").innerHTML = skills.map(s => `<span class="skill reveal">${s}</span>`).join("");

document.getElementById("grid").innerHTML = projects.map(p => `
  <div class="card reveal">
    <div class="status">${p.status}</div>
    <h3>${p.title}</h3>
    <p>${p.description}</p>
    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    <div class="links">
      ${p.live ? `<a href="${p.live}" target="_blank">Live ↗</a>` : ""}
      ${p.repo ? `<a href="${p.repo}" target="_blank">Code ↗</a>` : ""}
    </div>
  </div>
`).join("");

/* fade items in as you scroll, one after another */
const observer = new IntersectionObserver(entries => {
  entries.filter(e => e.isIntersecting).forEach((e, i) => {
    setTimeout(() => e.target.classList.add("in"), i * 80);
    observer.unobserve(e.target);
  });
}, { threshold: 0.1 });
document.querySelectorAll(".reveal").forEach(el => observer.observe(el));

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
